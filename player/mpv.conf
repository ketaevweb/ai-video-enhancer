# ============================================================
# AI Video Enhancer - конфиг mpv (портативный)
# ИИ-обработка (честный Real-ESRGAN через VapourSynth/TensorRT)
# включена по умолчанию для источников до 720p.
# Выключить на сеанс: Ctrl+0 (или запуск mpv с --vf=)
# ============================================================

vo=gpu-next
gpu-api=d3d11
hwdec=auto

# Качество вывода (вывод ИИ уже 1440p, скейлеры почти не работают)
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
dither-depth=auto

# Дебандинг выключен: ИИ-модель чувствительна к сглаживанию входа.
# Включить вручную: b  (см. input.conf)
deband=no

# ИИ-фильтр по умолчанию. Пресет "auto" = максимум для SD, максимум для HD,
# источники выше 720p проходят без обработки (см. engine/enhance.py).
vf=vapoursynth=%%BASE%%/engine/enhance_mpv.vpy:concurrent-frames=4:user-data=auto

# Поведение плеера
save-position-on-quit
keep-open=yes
screenshot-format=png
screenshot-high-bit-depth=yes
volume=100

# OSD
osd-font-size=32
osd-duration=2000
sub-auto=fuzzy
