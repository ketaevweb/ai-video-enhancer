# ============================================================
# AI Video Enhancer - хоткеи mpv
# Ctrl+1..4 - пресеты ИИ, Ctrl+0 - выключить ИИ, b - дебандинг
# ============================================================

# --- Пресеты ИИ (переключение на лету) ---
Ctrl+1 vf set "vapoursynth=%%BASE%%/engine/enhance_mpv.vpy:concurrent-frames=4:user-data=max"; show-text "AI: MAX (честный Real-ESRGAN)" 2000
Ctrl+2 vf set "vapoursynth=%%BASE%%/engine/enhance_mpv.vpy:concurrent-frames=4:user-data=fast"; show-text "AI: FAST (компактный Real-ESRGAN)" 2000
Ctrl+3 vf set "vapoursynth=%%BASE%%/engine/enhance_mpv.vpy:concurrent-frames=4:user-data=denoise"; show-text "AI: DENOISE (с шумоподавлением)" 2000
Ctrl+4 vf set "vapoursynth=%%BASE%%/engine/enhance_mpv.vpy:concurrent-frames=4:user-data=anime"; show-text "AI: ANIME (Real-ESRGAN AnimeVideo)" 2000
Ctrl+0 vf clear; show-text "AI: ВЫКЛ" 2000

# --- Дебандинг (для сильно битых источников) ---
b set deband !deband; show-text "Deband: ${deband}" 1500

# --- Скриншот обрабатываемого кадра (то, что видите вы) ---
Ctrl+s async screenshot

# --- Удобства ---
SPACE cycle pause
RIGHT seek  5
LEFT  seek -5
UP    seek  30
DOWN  seek -30
q quit
Q quit-watch-later
f cycle fullscreen
m cycle mute
